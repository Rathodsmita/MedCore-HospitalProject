server.port=${PORT:8080}

# MySQL (override with environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medcore}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Admin API token (send as: Authorization: Bearer <token>)
medcore.admin-token=${ADMIN_TOKEN:medcore-admin}

# Frontend origins allowed to call the API (comma separated). "*" = any (fine for local dev;
# in production set e.g. https://www.yourhospital.com)
medcore.cors-origins=${CORS_ORIGINS:*}
